<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Answer Sorter</title>
<meta name="theme-color" content="#1f5f4a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
  :root {
    --bg: #f7f6f2; --card: #ffffff; --ink: #1d1d1b; --muted: #5d5d58; --line: #d9d7cf;
    --brand: #1f5f4a; --brand-ink: #ffffff;
    --ok: #1e7a3c; --ok-bg: #e3f3e8;
    --trap: #9a5b00; --trap-bg: #fdf0db;
    --dud: #55555a; --dud-bg: #ececef;
    --bad: #a12a2a; --bad-bg: #fbe5e5;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #151614; --card: #1f201d; --ink: #f1f0ea; --muted: #b4b3ab; --line: #3a3b36;
      --brand: #5fb894; --brand-ink: #10221b;
      --ok: #7fd49b; --ok-bg: #1d3325; --trap: #f0b65c; --trap-bg: #3a2c14;
      --dud: #c4c4c9; --dud-bg: #2c2c30; --bad: #f08c8c; --bad-bg: #3a1e1e;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); }
  body { font: 17px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  #app { max-width: 560px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 1.6rem; margin: 8px 0 4px; }
  h2 { font-size: 1.2rem; margin: 18px 0 8px; }
  p { margin: 8px 0; }
  .hint { color: var(--muted); font-size: 0.95rem; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px; margin: 12px 0; }
  .stem { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px; font-size: 1.1rem; }
  .btn { display: block; width: 100%; min-height: 48px; margin: 10px 0; padding: 12px 16px; border: 0; border-radius: 10px;
         background: var(--brand); color: var(--brand-ink); font: inherit; font-weight: 600; cursor: pointer; }
  .btn[disabled] { opacity: 0.45; cursor: default; }
  .btn.ghost { background: transparent; color: var(--brand); border: 2px solid var(--brand); }
  .row { display: flex; gap: 8px; }
  .row > * { flex: 1; }
  .choice { min-height: 48px; padding: 10px; border: 2px solid var(--line); border-radius: 10px; background: var(--card);
            color: var(--ink); font: inherit; cursor: pointer; }
  .choice.on { border-color: var(--brand); background: var(--ok-bg); font-weight: 600; }
  select, textarea { width: 100%; font: inherit; padding: 10px; border-radius: 10px; border: 2px solid var(--line);
                     background: var(--card); color: var(--ink); }
  textarea { min-height: 90px; }
  .top { display: flex; justify-content: space-between; align-items: center; color: var(--muted); font-size: 0.95rem; }
  .linkbtn { background: none; border: 0; color: var(--brand); font: inherit; text-decoration: underline; cursor: pointer; padding: 8px 0; }
  .words { display: flex; flex-wrap: wrap; gap: 6px; }
  .word { padding: 8px 10px; min-height: 44px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg);
          color: var(--ink); font: inherit; cursor: pointer; }
  .word.target { background: var(--ok-bg); border-color: var(--ok); font-weight: 700; }
  .bet { text-align: left; }
  .bet span { display: block; font-weight: 400; font-size: 0.9rem; opacity: 0.85; }
  .answer { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px; margin: 10px 0; }
  .atext { font-size: 1.05rem; margin: 0 0 8px; }
  .labels { display: flex; gap: 6px; }
  .lab { flex: 1; min-height: 44px; border: 2px solid var(--line); border-radius: 8px; background: var(--card);
         color: var(--ink); font: inherit; cursor: pointer; }
  .lab-correct.on { background: var(--ok-bg); border-color: var(--ok); color: var(--ok); font-weight: 700; }
  .lab-trap.on { background: var(--trap-bg); border-color: var(--trap); color: var(--trap); font-weight: 700; }
  .lab-dud.on { background: var(--dud-bg); border-color: var(--dud); color: var(--dud); font-weight: 700; }
  .feedback { font-weight: 600; }
  .good { color: var(--ok); }
  .bad { color: var(--bad); }
  .tag { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 0.85rem; font-weight: 700; }
  .tag-correct { background: var(--ok-bg); color: var(--ok); }
  .tag-trap { background: var(--trap-bg); color: var(--trap); }
  .tag-dud { background: var(--dud-bg); color: var(--dud); }
  table { width: 100%; border-collapse: collapse; font-size: 0.95rem; }
  th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--line); }
  .mis { display: flex; justify-content: space-between; gap: 8px; padding: 8px 0; border-bottom: 1px solid var(--line); }
  .dot { width: 12px; height: 12px; border-radius: 50%; display: inline-block; margin-right: 8px; background: var(--trap); }
  .dot.green { background: var(--ok); }
  .printcard { border: 1px solid #999; border-radius: 8px; padding: 12px; margin: 10px 0; break-inside: avoid; page-break-inside: avoid; }
  .printcard ol { margin: 6px 0; padding-left: 22px; }
  .key { font-size: 0.85rem; color: var(--muted); border-top: 1px dashed #999; margin-top: 8px; padding-top: 6px; }
  @media print {
    .noprint { display: none !important; }
    body { background: #fff; color: #000; font-size: 12pt; }
    #app { max-width: none; padding: 0; }
    .key { color: #333; }
  }
</style>
</head>
<body>
<main id="app"><p>Loading...</p></main>
<noscript><p>This game needs JavaScript turned on.</p></noscript>
<script src="items.js"></script>
<script src="app.js"></script>
</body>
</html>
